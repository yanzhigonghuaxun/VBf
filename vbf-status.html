<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>状态</title>
<style>
  :root{--g:#b9965c;--g2:#c8a45a;--ash:#d7cec0;--ink:#0b0a09}
  *{box-sizing:border-box}
  html,body{margin:0;background:transparent;overflow:hidden}
  body{
    font-family:"Noto Serif SC","Songti SC",serif;color:var(--ash);
    padding:6px 4px;-webkit-tap-highlight-color:transparent;
  }
  .hud{
    width:100%;max-width:560px;margin:0 auto;position:relative;
    padding:12px 14px 10px;
    background:linear-gradient(180deg,rgba(14,12,10,.97),rgba(8,7,6,.98));
    border:1px solid rgba(185,150,92,.38);
    box-shadow:0 14px 36px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.5) inset;
  }
  .hud::before{content:"";position:absolute;inset:4px;border:1px solid rgba(185,150,92,.09);pointer-events:none}
  .top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
  .mon{font-size:13px;letter-spacing:.3em;color:#e8dcc6;padding-left:.15em}
  .meta{min-width:0;text-align:right;font-size:10px;letter-spacing:.16em;color:#8d8273}
  .badge{
    display:inline-block;margin-left:8px;padding:1px 7px;font-size:10px;letter-spacing:.14em;
    color:var(--g2);border:1px solid rgba(185,150,92,.3);background:rgba(185,150,92,.06);
    max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom;
  }
  .grid{display:flex;gap:14px;align-items:center}
  .bars{flex:1 1 auto;min-width:0}
  .g{margin-bottom:9px}
  .g:last-child{margin-bottom:0}
  .row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .k{font-size:10px;letter-spacing:.2em;color:#8d8273}
  .v{font-size:15px;color:#f0e6d4;font-variant-numeric:tabular-nums}
  .bar{height:5px;margin-top:4px;position:relative;overflow:hidden;
    background:rgba(255,255,255,.05);border:1px solid rgba(185,150,92,.14)}
  .bar i{position:absolute;left:0;top:0;bottom:0;display:block;width:0;
    transition:width .9s cubic-bezier(.22,.8,.3,1);
    background:linear-gradient(90deg,rgba(185,150,92,.5),var(--g2));
    box-shadow:0 0 12px rgba(185,150,92,.5)}
  .g.troop .bar i{background:linear-gradient(90deg,rgba(122,29,29,.6),#a33b3b);
    box-shadow:0 0 12px rgba(140,40,40,.5)}
  .map{flex:0 0 132px;height:132px;min-width:0}
  .map svg{width:100%;height:100%;overflow:visible}
  .ring{fill:none;stroke:rgba(185,150,92,.14);stroke-width:.8}
  .spoke{stroke:rgba(185,150,92,.12);stroke-width:.8}
  .node{fill:rgba(12,11,10,.9);stroke:rgba(185,150,92,.4);stroke-width:1;transition:.4s}
  .node.on{fill:rgba(185,150,92,.85);stroke:#e0c890;filter:drop-shadow(0 0 5px rgba(185,150,92,.8))}
  .map text{font-size:7px;fill:#8d8273;letter-spacing:.05em;font-family:inherit}
  .map text.on{fill:#e8dcc6}
  .map .num{font-size:6.5px;fill:#6f665a}
  .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:9px;
    padding-top:8px;border-top:1px solid rgba(185,150,92,.16)}
  .key{font-size:10px;color:#a8977c;letter-spacing:.08em;white-space:nowrap}
  .key b{color:#d8cdb9;font-weight:400}
  .goal{min-width:0;font-size:10px;color:#9a8f7e;text-align:right;line-height:1.5;overflow-wrap:anywhere}
  .goal::before{content:"▸ ";color:var(--g)}
  .msg{padding:12px 14px;font-size:11px;line-height:1.8;color:#a8977c;
    border:1px solid rgba(185,150,92,.28);background:rgba(14,12,10,.94);max-width:560px;margin:0 auto}
  .msg[hidden]{display:none}
  @media (max-width:520px){
    .grid{gap:10px}
    .map{flex-basis:104px;height:104px}
    .mon{font-size:12px;letter-spacing:.22em}
  }
  @media (max-width:360px){
    .map{flex-basis:88px;height:88px}
    .hud{padding:10px 10px 9px}
  }
  @media (prefers-reduced-motion:reduce){
    .bar i,.node{transition:none!important}
  }
</style>
</head>
<body>
<div class="msg" id="msg" hidden></div>
<div class="hud" id="hud">
  <div class="top">
    <span class="mon" id="mon">未开局</span>
    <span class="meta"><span id="diff">—</span><span class="badge" id="name">—</span></span>
  </div>
  <div class="grid">
    <div class="bars">
      <div class="g mat">
        <div class="row"><span class="k">物资</span><span class="v" id="mat">0</span></div>
        <div class="bar"><i id="matBar"></i></div>
      </div>
      <div class="g troop">
        <div class="row"><span class="k">兵力</span><span class="v" id="troop">0</span></div>
        <div class="bar"><i id="troopBar"></i></div>
      </div>
    </div>
    <div class="map" id="map"></div>
  </div>
  <div class="foot">
    <span class="key">命运之钥 · <b id="key">沉睡</b></span>
    <span class="goal" id="goal">等待开局…</span>
  </div>
</div>

<script>
(function(){
  "use strict";

  var DOMS = [
    { key:"埃达",       x:104, y:26,  side:"end"   },
    { key:"托尔德海姆", x:104, y:106, side:"end"   },
    { key:"福尔克",     x:28,  y:26,  side:"start" },
    { key:"古兰兹",     x:28,  y:106, side:"start" }
  ];
  var C = {x:66, y:66};
  var $ = function(id){ return document.getElementById(id); };
  var shown = "";
  var bridged = null, hasBridge = false, bootAt = Date.now();

  function parentHelper(){
    try{
      if(window.parent === window) return null;
      var H = window.parent.TavernHelper || window.parent.tavernHelper;
      if(H && typeof H.getVariables === "function") return H;
    }catch(e){}
    return null;
  }

  function leaf(v){ return Array.isArray(v) ? v[0] : v; }
  function num(v,d){ v = leaf(v); return typeof v === "number" && isFinite(v) ? v : d; }
  function str(v,d){ v = leaf(v); return typeof v === "string" ? v : d; }
  function clamp(p){ return Math.max(0, Math.min(1, p)); }

  function mapSVG(l){
    var nodes = DOMS.map(function(d){
      var c = num(l[d.key],0), on = c > 0;
      var label = d.key.length > 2 ? d.key.slice(0,3) : d.key;
      var tx = d.side === "end" ? d.x - 9 : d.x + 9;
      return '<line class="spoke" x1="'+C.x+'" y1="'+C.y+'" x2="'+d.x+'" y2="'+d.y+'"/>'
        + '<circle class="node'+(on?" on":"")+'" cx="'+d.x+'" cy="'+d.y+'" r="4.2"/>'
        + '<text class="'+(on?"on":"")+'" x="'+tx+'" y="'+(d.y+2.5)+'" text-anchor="'+(d.side==="end"?"end":"start")+'">'+label+'</text>'
        + '<text class="num" x="'+tx+'" y="'+(d.y+10)+'" text-anchor="'+(d.side==="end"?"end":"start")+'">'+c+'</text>';
    }).join("");
    var v = num(l.瓦尔哈拉,0);
    return '<svg viewBox="0 0 132 132" preserveAspectRatio="xMidYMid meet" aria-hidden="true">'
      + '<circle class="ring" cx="66" cy="66" r="40"/>'
      + '<circle class="ring" cx="66" cy="66" r="60" stroke-dasharray="2 5"/>'
      + '<circle class="node'+(v>0?" on":"")+'" cx="66" cy="66" r="7" stroke="#b9965c"/>'
      + '<text x="66" y="66" text-anchor="middle" dominant-baseline="central" style="font-size:5.5px;fill:#c8a45a">瓦尔哈拉</text>'
      + nodes + '</svg>';
  }

  function set(id, text){
    var el = $(id);
    if(el) el.textContent = text;
  }

  function renderEmpty(){
    set("mon", "未开局");
    set("diff", "—");
    set("name", "—");
    set("mat", "0");
    set("troop", "0");
    $("matBar").style.width = "0%";
    $("troopBar").style.width = "0%";
    $("map").innerHTML = mapSVG({});
    set("key", "沉睡");
    set("goal", "等待开局…");
  }

  function render(sd){
    var g = (sd.玩家 && typeof sd.玩家 === "object") ? sd.玩家 : {};
    var p = (sd.进展 && typeof sd.进展 === "object") ? sd.进展 : {};
    var l = (sd.领地 && typeof sd.领地 === "object") ? sd.领地 : {};
    var mat = num(sd.物资, 0), trp = num(sd.兵力, 0);

    set("mon", "第 " + num(sd.月份, 1) + " 月");
    set("diff", str(g.难度, "—"));
    set("name", str(g.名字, "洛基"));
    set("mat", mat);
    set("troop", trp);
    $("matBar").style.width = clamp(mat / 400) * 100 + "%";
    $("troopBar").style.width = clamp(trp / 200) * 100 + "%";
    $("map").innerHTML = mapSVG(l);
    set("key", str(p.命运之钥, "沉睡"));
    set("goal", str(p.当前目标, "—") || "—");
  }

  function showMessage(text){
    var m = $("msg");
    m.textContent = text;
    m.hidden = false;
    $("hud").style.display = "none";
  }

  function measureHeight(){
    return Math.max(
      document.documentElement.scrollHeight || 0,
      document.body ? document.body.scrollHeight : 0,
      200
    ) + 2;
  }

  function syncHeight(){
    var h = measureHeight();
    try{
      if(window.frameElement) window.frameElement.style.height = h + "px";
    }catch(e){}
    try{
      if(window.parent !== window){
        window.parent.postMessage({
          type: "vbf-status-height",
          protocol: "vbf-status/1",
          height: h
        }, "*");
      }
    }catch(e){}
  }

  // 旧楼层如果还留着上一版 iframe，自动收起，避免一串状态栏
  function isStale(){
    try{
      var fe = window.frameElement;
      if(!fe || !fe.closest) return false;
      var mes = fe.closest(".mes");
      if(!mes) return false;
      var all = window.parent.document.querySelectorAll(".mes");
      var last = all[all.length - 1];
      if(last === mes) return false;
      if(last && last.classList.contains("is_user") && all[all.length - 2] === mes) return false;
      return true;
    }catch(e){ return false; }
  }

  function directStat(){
    var H = parentHelper();
    if(!H) return null;
    try{
      var v = H.getVariables({type:"chat"}) || {};
      return (v && typeof v.stat_data === "object") ? v.stat_data : null;
    }catch(e){ return null; }
  }

  function tick(force){
    try{
      if(window.frameElement) window.frameElement.style.display = isStale() ? "none" : "";
    }catch(e){}

    var H = parentHelper();
    var sd = directStat();
    if(sd === null && hasBridge) sd = bridged;

    // 跨域且桥接还没到：先等一会儿，不要立刻报错
    if(sd === null && !hasBridge && !H){
      if(Date.now() - bootAt < 4000){
        showMessage("正在等待酒馆状态…");
      }else{
        showMessage("状态栏已加载，但没有收到酒馆数据。确认角色卡里的「VBF 前端」脚本已启用。");
      }
      syncHeight();
      return;
    }

    var sig = sd ? JSON.stringify(sd) : "null";
    if(force || sig !== shown){
      shown = sig;
      $("msg").hidden = true;
      $("hud").style.display = "";
      if(sd) render(sd); else renderEmpty();
      syncHeight();
      setTimeout(syncHeight, 200);
    }
  }

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", function(){ setTimeout(function(){ tick(true); }, 60); });
  }else{
    setTimeout(function(){ tick(true); }, 60);
  }
  setInterval(function(){ tick(false); }, 1200);
  window.addEventListener("load", function(){ setTimeout(syncHeight, 250); });
  window.addEventListener("message", function(event){
    if(event.source !== window.parent) return;
    var d = event.data || {};
    if(d.protocol && d.protocol !== "vbf-status/1") return;
    if(d.type === "vbf-state"){
      hasBridge = true;
      bridged = d.stat_data && typeof d.stat_data === "object" ? d.stat_data : null;
      tick(true);
    }
  });
  if(window.ResizeObserver){
    new ResizeObserver(syncHeight).observe(document.body);
  }
})();
</script>
</body>
</html>
