<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>尤格德拉希尔继承战 · 军略</title>
<style>
  :root{
    --ink:#0a0704;--panel:#241a11;--panel2:#0f0a06;
    --line:rgba(211,171,99,.20);--line2:rgba(211,171,99,.42);
    --gold:#d3ab63;--gold-hi:#f7e3b6;--gold-lo:#9a763a;--gold-dk:#5e4720;
    --paper:#ece0c6;--ash:#c8ba9e;--muted:#9a8b70;--dim:#6d6252;
    --seal:#a63a2c;--blood:#c05a4c;--ok:#93b378;
    --moon:#d3ab63;--acc:#d3ab63;
    --p-info:none;--p-head:none;--p-row:none;
    --edda:#8cbd84;--thord:#d99a4f;--fulk:#c87b4e;--gulanz:#89aac6;--valhalla:#e3ce93;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:transparent;overflow:hidden}
  body{
    font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong",serif;
    color:var(--ash);padding:4px 2px 6px;-webkit-tap-highlight-color:transparent;
  }
  img{display:block;border:0}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

  /* ── 外框 ── */
  .hud{position:relative;width:100%;max-width:620px;margin:0 auto;
    background:
      radial-gradient(130% 80% at 50% -14%,rgba(211,171,99,.12),transparent 60%),
      radial-gradient(90% 60% at 100% 100%,rgba(166,58,44,.10),transparent 66%),
      linear-gradient(180deg,#251b11,var(--panel2) 76%);
    border:1px solid rgba(211,171,99,.34);
    box-shadow:0 18px 44px rgba(0,0,0,.62),inset 0 1px 0 rgba(247,227,182,.10);
    isolation:isolate;}
  .hud::before{content:"";position:absolute;inset:3px;pointer-events:none;opacity:.85;
    background:
      linear-gradient(var(--gold),var(--gold)) 0 0/14px 1px no-repeat,
      linear-gradient(var(--gold),var(--gold)) 0 0/1px 14px no-repeat,
      linear-gradient(var(--gold),var(--gold)) 100% 0/14px 1px no-repeat,
      linear-gradient(var(--gold),var(--gold)) 100% 0/1px 14px no-repeat,
      linear-gradient(var(--gold),var(--gold)) 0 100%/14px 1px no-repeat,
      linear-gradient(var(--gold),var(--gold)) 0 100%/1px 14px no-repeat,
      linear-gradient(var(--gold),var(--gold)) 100% 100%/14px 1px no-repeat,
      linear-gradient(var(--gold),var(--gold)) 100% 100%/1px 14px no-repeat;}

  /* ── 抬头 ── */
  .bar{display:flex;align-items:center;gap:10px;padding:9px 12px 8px;min-width:0;position:relative;
    background-position:50% 45%;background-size:100% 100%;background-repeat:no-repeat}
  .bar::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(70% 120% at 12% 0%,var(--moon),transparent 68%);opacity:.16}
  .bar::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:1px;
    background:linear-gradient(90deg,transparent,var(--moon),rgba(211,171,99,.25) 76%,transparent);
    opacity:.9}
  .moon{flex:0 0 auto;width:40px;height:44px;display:grid;place-items:center;align-content:center;
    background:linear-gradient(158deg,#8a2b23,#3d0d0a);border:1px solid var(--moon);
    box-shadow:0 3px 12px rgba(0,0,0,.55),inset 0 0 16px rgba(0,0,0,.55);position:relative}
  .moon::after{content:"";position:absolute;inset:2px;border:1px solid rgba(247,227,182,.22)}
  .moon b{font-size:19px;line-height:1;font-weight:500;color:#fbf0d8;
    text-shadow:0 1px 4px rgba(0,0,0,.7)}
  .moon i{font-style:normal;font-size:7.5px;line-height:1;margin-top:3px;letter-spacing:.3em;
    padding-left:.3em;color:rgba(251,240,216,.7)}
  .moon[data-v=""] b{color:rgba(251,240,216,.35)}
  .id{flex:1 1 auto;min-width:0}
  .id .n{display:flex;align-items:baseline;gap:6px}
  .id .n b{font-size:14px;font-weight:500;color:#f6ecd8;letter-spacing:.06em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .id .n em{font-style:normal;font-size:8.5px;letter-spacing:.12em;color:var(--muted);
    border-left:1px solid rgba(211,171,99,.28);padding-left:6px;flex:0 0 auto}
  .id .t{font-size:10px;letter-spacing:.06em;margin-top:3px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .id .t span{color:var(--moon);opacity:.92}
  .id .t s{text-decoration:none;color:var(--ash);margin-left:7px;opacity:.82}
  .res{flex:0 0 auto;display:flex;gap:7px;padding-left:9px;border-left:1px solid rgba(211,171,99,.18)}
  .res .r{display:flex;align-items:center;gap:4px;padding:3px 6px 3px 5px;cursor:pointer;
    background:linear-gradient(180deg,rgba(211,171,99,.13),rgba(211,171,99,.03));
    border:1px solid rgba(211,171,99,.22);transition:border-color .2s,background .2s}
  .res .r::after{content:"⌄";font-size:8px;color:var(--gold-lo);margin-left:1px;line-height:1}
  .res .r:active{background:linear-gradient(180deg,rgba(211,171,99,.24),rgba(211,171,99,.08))}
  .moon{cursor:pointer}
  .moon::before{content:"⌄";position:absolute;right:2px;bottom:1px;font-size:7px;
    color:rgba(251,240,216,.55);z-index:2}
  .res .r b{font-weight:400;font-size:14px;line-height:1;color:#f8eeda;
    font-variant-numeric:tabular-nums;letter-spacing:.01em}
  .res svg.ri{width:15px;height:15px;flex:0 0 auto;fill:none;stroke:currentColor;
    stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;color:var(--gold);
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.8))}

  /* ── 页签 ── */
  .tabs{display:flex;gap:1px;padding:4px 6px 0;position:relative;
    background:linear-gradient(180deg,rgba(211,171,99,.09),rgba(211,171,99,.015) 72%,transparent);
    border-bottom:1px solid rgba(211,171,99,.26)}
  .tabs button{flex:1 1 0;min-height:46px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:3px;padding:4px 2px 5px;position:relative}
  .tabs button .ti{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.45;
    stroke-linejoin:round;stroke-linecap:round;color:var(--dim);opacity:.85;
    transition:color .25s,opacity .25s,transform .25s}
  .tabs button span{font-size:9.5px;letter-spacing:.12em;text-indent:.12em;color:var(--dim);
    transition:color .25s}
  .tabs button[aria-selected="true"] .ti{opacity:1;color:var(--gold-hi);transform:translateY(-1px);
    filter:drop-shadow(0 0 6px rgba(211,171,99,.5))}
  .tabs button[aria-selected="true"] span{color:var(--gold-hi)}
  .tabs button::after{content:"";position:absolute;left:16%;right:16%;bottom:-1px;height:2px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);transform:scaleX(0);
    transition:transform .28s}
  .tabs button[aria-selected="true"]::after{transform:scaleX(1);
    box-shadow:0 0 9px rgba(211,171,99,.55)}

  .pane{display:none;position:relative;padding:9px 10px 11px;min-height:390px;--acc:var(--gold)}
  .pane::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(80% 55% at 50% 0%,var(--acc),transparent 72%);opacity:.15}
  .pane[data-pane="rec"]{--acc:#c8703f}
  .pane[data-pane="gear"]{--acc:#b8964f}
  .pane[data-pane="who"]{--acc:#a87cbd}
  .pane[data-pane="nat"]{--acc:#74a183}
  .pane[data-pane="who"],.pane[data-pane="gear"]{max-height:390px;overflow-y:auto;
    -webkit-overflow-scrolling:touch;scrollbar-width:thin}
  .pane[data-on="1"]{display:block;animation:fade .25s ease}
  .pane[data-pane="rec"][data-on="1"]{display:flex;flex-direction:column}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  /* ── 地图 ── */
  .mapbox{position:relative;border:1px solid rgba(211,171,99,.30);overflow:hidden;
    background:#0a0d10 center/cover no-repeat;
    box-shadow:inset 0 0 52px rgba(0,0,0,.78),0 2px 10px rgba(0,0,0,.5)}
  svg.map{display:block;width:100%;height:auto;touch-action:manipulation}
  .hull{cursor:pointer}
  .city{cursor:pointer}
  .city .hit{fill:transparent;stroke:none}
  .tl{font-family:inherit;fill:#e7dcc4;paint-order:stroke;stroke:#08090b;stroke-width:2.5px;
    stroke-linejoin:round;stroke-linecap:round}
  .tl.n{font-size:8.2px}
  .tl.n.sm{font-size:7px}
  .tl.g{font-size:6.6px;fill:rgba(226,210,182,.86)}
  .tl.d{font-size:12.5px;letter-spacing:.14em;fill:#f8eeda}
  .tl.s{font-size:8px;letter-spacing:.05em;fill:#c3b699}
  .tl.c{font-size:7px;letter-spacing:.3em;fill:rgba(211,171,99,.6)}
  .cart{fill:rgba(10,8,5,.72);stroke:rgba(211,171,99,.32);stroke-width:.7}
  .ring{fill:none;stroke:#f7e9c6;stroke-width:1.1;opacity:.9}
  .pulse{fill:none;stroke:#ffe9b8;stroke-width:1.2;opacity:.7;animation:pulse 2.4s ease-out infinite}
  @keyframes pulse{0%{r:3;opacity:.85}70%{r:9;opacity:0}100%{opacity:0}}
  .star{fill:#f8e7ba;stroke:#7a5f2c;stroke-width:.6}
  .maptip{position:absolute;left:0;right:0;bottom:0;padding:5px 9px;font-size:9px;
    letter-spacing:.05em;color:#c9b995;background:linear-gradient(0deg,rgba(8,6,4,.94),transparent);
    display:flex;justify-content:space-between;gap:8px;pointer-events:none}
  .mapback{position:absolute;left:8px;top:8px;display:flex;align-items:center;gap:5px;
    min-height:32px;padding:6px 13px;font-size:11.5px;letter-spacing:.08em;text-indent:.08em;
    color:var(--gold-hi);border:1px solid rgba(211,171,99,.6);border-radius:2px;
    background:linear-gradient(180deg,rgba(60,42,21,.96),rgba(24,16,8,.97));
    box-shadow:0 4px 12px rgba(0,0,0,.6),inset 0 1px 0 rgba(247,227,182,.2)}
  .mapback:active{transform:translateY(1px);filter:brightness(1.12)}
  .maplegend{display:flex;flex-wrap:wrap;gap:4px 11px;margin-top:4px;padding:4px 8px;
    border:1px solid rgba(211,171,99,.18);
    background:linear-gradient(180deg,rgba(211,171,99,.06),rgba(211,171,99,.015))}
  .maplegend span{display:inline-flex;align-items:center;gap:4px;font-size:8.5px;
    color:var(--ash);letter-spacing:.02em}
  .maplegend i{width:7px;height:7px;flex:0 0 auto;transform:rotate(45deg);
    box-shadow:0 0 5px rgba(0,0,0,.6)}
  .maplegend i.ln{width:13px;height:0;border-top:1px dashed rgba(211,171,99,.75);transform:none;
    box-shadow:none}
  .maplegend i.sea{width:13px;height:0;border-top:1px dotted rgba(140,196,220,.85);transform:none;
    box-shadow:none}

  /* ── 弹层 ── */
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:5;max-height:96%;overflow-y:auto;
    -webkit-overflow-scrolling:touch;scrollbar-width:thin;
    background-image:linear-gradient(180deg,rgba(30,21,13,.80),rgba(12,8,5,.93)),var(--p-info);
    background-size:100% 100%;background-repeat:no-repeat;
    border-top:2px solid rgba(211,171,99,.55);
    box-shadow:0 -16px 36px rgba(0,0,0,.68),inset 0 1px 0 rgba(247,227,182,.16);
    padding:10px 11px 12px;animation:up .22s ease}
  @keyframes up{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
  .sheet .sh{display:flex;align-items:baseline;gap:7px;min-width:0}
  .sheet .sh b{font-size:13px;font-weight:500;color:#f8eeda;letter-spacing:.05em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sheet .sh i{font-style:normal;font-size:9px;letter-spacing:.08em;color:#b49a6b}
  .sheet .sh button{margin-left:auto;flex:0 0 auto;font-size:10.5px;color:var(--ash);
    padding:3px 9px;border:1px solid rgba(211,171,99,.3);
    background:rgba(211,171,99,.08)}
  .sheet--char{max-height:96%;overflow-y:auto}
  .cbody{display:flex;gap:11px;margin-top:8px;align-items:flex-start}
  .cframe{flex:0 0 auto;width:94px;height:132px;position:relative;overflow:hidden;
    border:1px solid rgba(211,171,99,.45);background:linear-gradient(180deg,rgba(211,171,99,.16),transparent);
    box-shadow:0 3px 12px rgba(0,0,0,.5),inset 0 0 0 1px rgba(0,0,0,.4)}
  .cframe img{width:100%;height:100%;object-fit:cover;object-position:50% 4%}
  .cframe.cor img{filter:saturate(.6) contrast(1.08) hue-rotate(-24deg) brightness(.85)}
  .cfbadge{position:absolute;left:0;right:0;bottom:0;padding:2px 0;text-align:center;
    font-size:8px;letter-spacing:.06em;color:#f6ead2;background:rgba(10,7,4,.74);
    border-top:1px solid rgba(211,171,99,.4)}
  .cframe.cor::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(120,20,70,.3),rgba(40,0,30,.42));mix-blend-mode:multiply}
  .cinfo{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:5px}
  .crow{display:flex;gap:6px;flex-wrap:wrap;font-size:10px;color:var(--ash);align-items:baseline}
  .crow s{text-decoration:none;color:var(--muted);font-size:9px;letter-spacing:.06em}
  .crow b{font-weight:400;color:#f6ead2}
  .crow b.hot{color:#e3a08f}
  .cbg{margin-top:8px;font-size:9.5px;line-height:1.7;color:#c9bd9d;
    border-left:2px solid rgba(211,171,99,.35);padding-left:9px}
  .cth{margin-top:7px;font-size:10px;line-height:1.65;color:#d8c9a8}
  .cth i{font-style:normal;color:var(--dim);font-size:9px;margin-right:4px}
  .sheet .srow{display:flex;gap:12px;margin-top:7px;font-size:10px;color:var(--ash);flex-wrap:wrap}
  .sheet .srow s{text-decoration:none;color:var(--muted);margin-right:4px}
  .sheet .srow b{font-weight:400;color:#f6ead2;font-variant-numeric:tabular-nums}

  /* 按键差分：初始（凹、暗）／已选（凸、金）／确认（实心金）／次要（无框） */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;
    min-height:36px;padding:7px 15px;font-size:11px;letter-spacing:.14em;text-indent:.14em;
    color:var(--ash);border:1px solid rgba(211,171,99,.34);border-radius:2px;
    background:linear-gradient(180deg,rgba(211,171,99,.10),rgba(0,0,0,.30));
    box-shadow:inset 0 1px 0 rgba(247,227,182,.10),inset 0 -3px 7px rgba(0,0,0,.4);
    transition:background .2s,color .2s,border-color .2s,box-shadow .2s}
  .btn:active{transform:translateY(1px)}
  .btn[aria-pressed="true"]{color:#201507;border-color:#f2d79f;font-weight:600;
    background:linear-gradient(180deg,#f4dca9,#c69d54 52%,#8c682a);
    box-shadow:0 3px 10px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,246,214,.85);
    transform:translateY(-1px)}
  .btn[aria-pressed="true"]::before{content:"✓";font-size:.88em;margin-right:3px;font-weight:700}
  .btn--go{color:#201507;border-color:#f4dba6;font-weight:600;
    background:linear-gradient(180deg,#f4dba6,#c9a35f 47%,#8c682a);
    box-shadow:0 4px 12px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,246,218,.75)}
  .btn--go:disabled{opacity:.32;box-shadow:none}
  .btn--quiet{color:var(--dim);border-color:rgba(211,171,99,.16);background:none;box-shadow:none}
  .btn--violet{color:#e6b0d8;border-color:rgba(190,120,175,.55);
    background:linear-gradient(180deg,rgba(130,64,112,.45),rgba(58,22,50,.7));
    box-shadow:inset 0 1px 0 rgba(255,226,246,.18),inset 0 -3px 7px rgba(0,0,0,.45)}
  .btn--violet[aria-pressed="true"]{color:#2c0a26;border-color:#ffdcf3;font-weight:600;
    background:linear-gradient(180deg,#ffd5f0,#dd85c8 44%,#9c3f85);
    box-shadow:0 0 0 1px rgba(255,214,240,.6),0 4px 16px rgba(190,70,160,.6),
      inset 0 1px 0 rgba(255,255,255,.75);transform:translateY(-1px)}
  .btn--sm{min-height:26px;padding:3px 9px;font-size:9.5px;letter-spacing:.06em;text-indent:.06em}

  .pick{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .pick button{font-size:10px;letter-spacing:.05em;padding:4px 9px;color:var(--ash);
    border:1px solid rgba(211,171,99,.26);background:rgba(255,247,230,.03)}
  .pick button[aria-pressed="true"]{color:#1d1306;border-color:#f0d69f;font-weight:600;
    background:linear-gradient(180deg,#ecd197,#bf9951)}
  .pick .none{font-size:10px;color:var(--dim)}

  /* 通用折叠块 */
  .fold{margin-top:7px}
  .fold > .stog{border-color:rgba(211,171,99,.22)}
  .fold .fbody{display:none;margin-top:6px;padding-left:1px}
  .fold[data-open="1"] .fbody{display:block;animation:fade .2s ease}
  .fold[data-open="1"] > .stog{border-color:rgba(211,171,99,.45)}
  .sbody{margin-top:2px}
  .kline{display:flex;gap:8px;align-items:baseline;font-size:10px;color:var(--ash);
    padding:4px 0;border-bottom:1px solid rgba(211,171,99,.10)}
  .kline:last-child{border-bottom:0}
  .kline s{text-decoration:none;flex:0 0 auto;width:58px;color:var(--muted);font-size:9px;letter-spacing:.05em}
  .kline b{font-weight:400;color:#f6ead2;font-variant-numeric:tabular-nums;margin-left:auto}
  .kline em{font-style:normal;font-size:9px;color:var(--dim);margin-left:6px}
  .clist{display:flex;flex-direction:column;gap:3px;max-height:168px;overflow-y:auto;
    -webkit-overflow-scrolling:touch;scrollbar-width:thin;margin-top:2px}
  .crow2{display:flex;align-items:center;gap:6px;padding:5px 7px;min-height:30px;
    border:1px solid rgba(211,171,99,.14);background:rgba(255,247,230,.025);
    font-size:10px;color:#e8dcc2;text-align:left;width:100%}
  .crow2:active{filter:brightness(1.15)}
  .crow2 .dot{width:6px;height:6px;flex:0 0 auto;transform:rotate(45deg);background:var(--gold-lo)}
  .crow2.own .dot{background:var(--gold-hi);box-shadow:0 0 5px rgba(211,171,99,.8)}
  .crow2 .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .crow2 .g{flex:0 0 auto;font-size:9px;color:var(--muted);font-variant-numeric:tabular-nums}
  .crow2.ok{border-color:rgba(211,171,99,.4)}
  .crow2.lock{opacity:.55}
  .mapdom{position:absolute;right:8px;top:8px;display:flex;align-items:center;gap:5px;
    min-height:32px;padding:5px 11px;font-size:10.5px;letter-spacing:.04em;color:var(--gold-hi);
    border:1px solid rgba(211,171,99,.6);border-radius:2px;
    background:linear-gradient(180deg,rgba(60,42,21,.96),rgba(24,16,8,.97));
    box-shadow:0 4px 12px rgba(0,0,0,.6),inset 0 1px 0 rgba(247,227,182,.2)}
  .mapdom:active{transform:translateY(1px)}
  .mapdom s{text-decoration:none;font-size:9px;color:var(--muted)}
  .ncell{cursor:pointer;position:relative}
  .ncell::after{content:"⌄";position:absolute;right:8px;top:7px;font-size:9px;color:var(--gold-lo)}
  .ncell:active{filter:brightness(1.12)}
  .sect{margin-top:8px}
  .stog{display:flex;align-items:center;gap:6px;width:100%;min-height:32px;padding:5px 8px;
    border:1px solid rgba(211,171,99,.26);
    background:linear-gradient(180deg,rgba(211,171,99,.10),rgba(211,171,99,.02));text-align:left}
  .stog s{text-decoration:none;font-size:9px;letter-spacing:.16em;color:var(--muted);flex:0 0 auto}
  .stog b{flex:1 1 auto;min-width:0;font-weight:400;font-size:10.5px;color:#f2e3c4;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stog i{font-style:normal;font-size:9px;color:var(--gold);transition:transform .2s}
  .sect[data-open="1"] .stog i{transform:rotate(180deg)}
  .sect[data-open="1"] .stog{border-color:rgba(211,171,99,.45)}
  .sect .pick{display:none;margin-top:6px}
  .sect[data-open="1"] .pick{display:flex}

  .big{display:flex;margin-top:10px;gap:7px;flex-wrap:wrap}
  .big .btn{flex:1 1 auto}
  .big .btn--quiet{flex:0 0 auto;padding:8px 14px}

  /* ── 征兵 ── */
  .rec{flex:1 1 auto;display:flex;flex-direction:column;justify-content:space-between;gap:9px}
  .stepper{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 8px;
    border:1px solid rgba(211,171,99,.22);
    background-image:linear-gradient(180deg,rgba(30,21,13,.72),rgba(12,8,5,.84)),var(--p-info);
    background-size:100% 100%}
  .stepper button{width:48px;height:48px;font-size:18px;color:var(--gold-hi);
    border:1px solid rgba(211,171,99,.5);
    background:linear-gradient(180deg,rgba(211,171,99,.22),rgba(211,171,99,.05));
    box-shadow:inset 0 1px 0 rgba(247,227,182,.22)}
  .stepper button:active{filter:brightness(1.2)}
  .stepper .v{min-width:96px;text-align:center}
  .stepper .v b{display:block;font-size:32px;line-height:1;font-weight:400;color:#fbf0d8;
    font-variant-numeric:tabular-nums;text-shadow:0 2px 10px rgba(0,0,0,.6)}
  .stepper .v i{font-style:normal;font-size:9px;letter-spacing:.2em;color:var(--muted)}
  .calc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .calc .c{padding:8px 10px;border:1px solid rgba(211,171,99,.20);border-left:2px solid var(--acc);
    background-image:linear-gradient(180deg,rgba(24,17,10,.74),rgba(12,8,5,.84)),var(--p-row);
    background-size:100% 100%}
  .calc .c u{display:block;text-decoration:none;font-size:9px;letter-spacing:.16em;color:var(--muted)}
  .calc .c b{display:block;margin-top:4px;font-weight:400;font-size:18px;color:#f6ead2;
    font-variant-numeric:tabular-nums}
  .calc .c.neg b{color:#e08d76}
  .hintline{font-size:9.5px;line-height:1.65;color:var(--muted);letter-spacing:.03em}
  .ilist{display:flex;flex-direction:column;gap:5px}
  .irow{display:flex;align-items:center;gap:6px;padding:7px 9px;
    border:1px solid rgba(211,171,99,.18);border-left:2px solid var(--acc);
    background-image:linear-gradient(180deg,rgba(26,18,11,.72),rgba(12,8,5,.84)),var(--p-row);
    background-size:100% 100%}
  .irow .nm{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:5px;
    font-size:10.5px;color:#eee1c9;text-align:left;overflow:hidden;white-space:nowrap}
  .irow .nm span{overflow:hidden;text-overflow:ellipsis}
  .irow .nm .ar{font-style:normal;font-size:8px;color:var(--gold);transition:transform .2s;flex:0 0 auto}
  .irow[data-open="1"] .nm .ar{transform:rotate(180deg)}
  .inote{display:none;margin:-1px 0 2px;padding:7px 10px 8px 22px;font-size:9.5px;line-height:1.7;
    color:#c6b795;border:1px solid rgba(211,171,99,.16);border-left:2px solid var(--acc);
    border-top:0;background:linear-gradient(180deg,rgba(211,171,99,.055),rgba(0,0,0,.22))}
  .irow[data-open="1"] + .inote{display:block;animation:fade .2s ease}
  .irow button{min-height:29px;font-size:10px;padding:4px 11px;
    border:1px solid rgba(211,171,99,.3);color:var(--ash);background:rgba(211,171,99,.06)}
  .irow button.u{color:#201507;border-color:#eccf94;background:linear-gradient(180deg,#e9cd92,#b9904a)}
  .irow button.s{color:#d8a98a;border-color:rgba(184,120,80,.5);background:rgba(184,120,80,.12)}
  .ilist .none{font-size:10px;color:var(--dim);letter-spacing:.1em}

  /* ── 军备 ── */
  .filters{display:flex;gap:2px;margin-bottom:9px;padding:2px;
    border:1px solid rgba(211,171,99,.2);background:rgba(0,0,0,.3)}
  .filters button{flex:1 1 0;padding:6px 0;font-size:10.5px;letter-spacing:.16em;
    text-indent:.16em;color:var(--muted);transition:color .2s}
  .filters button[aria-pressed="true"]{color:#201507;font-weight:600;
    background:linear-gradient(180deg,#ecd197,#bb9450);box-shadow:inset 0 1px 0 rgba(255,246,214,.6)}
  .inv{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
  .inv button{font-size:10px;padding:4px 9px;color:#f0e2c6;
    border:1px solid rgba(211,171,99,.3);
    background:linear-gradient(180deg,rgba(211,171,99,.16),rgba(211,171,99,.04))}
  .inv button b{font-weight:400;color:var(--gold);margin-left:5px;font-size:9px}
  .inv .none{font-size:10px;color:var(--dim);letter-spacing:.1em}
  .slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:6px}
  .srow2{display:flex;align-items:center;gap:6px;padding:5px 7px;
    border:1px solid rgba(211,171,99,.14);
    background-image:linear-gradient(180deg,rgba(24,17,10,.68),rgba(11,8,5,.82)),var(--p-row);
    background-size:100% 100%}
  .srow2 .nm{flex:0 0 auto;width:58px;font-size:10px;color:#e6d8bc;letter-spacing:.04em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .srow2 .sl{flex:1 1 0;min-width:0;min-height:26px;font-size:9px;padding:3px 5px;text-align:center;
    color:var(--dim);border:1px dashed rgba(211,171,99,.3);overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;background:rgba(0,0,0,.2)}
  .srow2 .sl.on{color:#f6ead2;border-style:solid;border-color:rgba(211,171,99,.5);
    background:rgba(211,171,99,.12)}

  /* ── 人物 ── */
  .hero{display:flex;align-items:center;gap:9px;margin-bottom:8px;padding:7px 9px;
    border:1px solid rgba(211,171,99,.22);border-left:2px solid var(--gold);
    background-image:linear-gradient(180deg,rgba(28,20,12,.72),rgba(12,8,5,.84)),var(--p-row);
    background-size:100% 100%}
  .hero b{flex:0 0 auto;font-size:11.5px;font-weight:500;color:var(--gold-hi);letter-spacing:.06em}
  .hero s{text-decoration:none;flex:1 1 auto;min-width:0;font-size:9.5px;color:var(--ash);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hero i{flex:0 0 auto;font-style:normal;font-size:9px;color:var(--muted)}
  .sechead{display:flex;align-items:center;gap:8px;margin:3px 0 7px;padding:3px 0;font-size:9px;
    letter-spacing:.22em;text-indent:.22em;color:var(--gold);position:relative}
  .sechead::after{content:"";flex:1 1 auto;height:1px;
    background:linear-gradient(90deg,rgba(211,171,99,.55),rgba(211,171,99,.05))}
  .plist{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:7px}
  .pcard{display:flex;gap:8px;padding:7px;min-width:0;border-left:2px solid var(--acc);
    border-top:1px solid rgba(211,171,99,.16);border-right:1px solid rgba(211,171,99,.16);
    border-bottom:1px solid rgba(211,171,99,.16);
    background-image:linear-gradient(180deg,rgba(28,20,12,.72),rgba(12,8,5,.84)),var(--p-row);
    background-size:100% 100%;transition:border-color .2s,filter .2s}
  .pcard:active{filter:brightness(1.14)}
  .pcard.corrupt{border-left-color:#b46aa8;
    background-image:linear-gradient(180deg,rgba(62,26,48,.78),rgba(22,8,18,.9)),var(--p-row)}
  .pcard .pt{flex:0 0 auto;width:46px;height:62px;position:relative;overflow:hidden;
    background:linear-gradient(180deg,rgba(211,171,99,.16),transparent);
    border:1px solid rgba(211,171,99,.32);box-shadow:0 2px 8px rgba(0,0,0,.45)}
  .pcard .pt img{width:100%;height:100%;object-fit:cover;object-position:50% 6%}
  .pcard.corrupt .pt img{filter:saturate(.55) contrast(1.1) hue-rotate(-25deg) brightness(.82)}
  .pcard.corrupt .pt::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(120,20,70,.35),rgba(40,0,30,.45));mix-blend-mode:multiply}
  .pcard .pb{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:4px}
  .pcard .p1{display:flex;align-items:center;gap:5px;min-width:0;flex-wrap:wrap}
  .pcard .p1 b{font-size:11.5px;font-weight:500;color:#f8eeda;letter-spacing:.05em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag{flex:0 0 auto;font-style:normal;font-size:8px;letter-spacing:.08em;padding:1px 5px;
    color:var(--ash);border:1px solid rgba(160,146,124,.34);background:rgba(0,0,0,.22)}
  .tag.good{color:#b3d199;border-color:rgba(147,179,120,.55);background:rgba(80,120,60,.16)}
  .tag.evil{color:#e0958c;border-color:rgba(181,81,74,.55);background:rgba(120,40,34,.2)}
  .tag.far{color:var(--muted);border-style:dashed}
  .mtr{display:flex;align-items:center;gap:5px}
  .mtr s{text-decoration:none;flex:0 0 auto;font-size:8.5px;letter-spacing:.06em;color:var(--muted);width:22px}
  .mtr u{flex:1 1 auto;height:4px;text-decoration:none;background:rgba(255,247,230,.10);
    overflow:hidden;box-shadow:inset 0 1px 1px rgba(0,0,0,.5)}
  .mtr u i{display:block;height:100%;background:linear-gradient(90deg,#8c682a,#f0d69f);
    transition:width .5s}
  .mtr b{flex:0 0 auto;font-weight:400;font-size:9px;color:var(--ash);min-width:18px;text-align:right;
    font-variant-numeric:tabular-nums}
  .mtr.hot u i{background:linear-gradient(90deg,#7a2f2f,#d4736b)}
  .mtr.cor u i{background:linear-gradient(90deg,#5b2a63,#c685c6)}
  .mtr.miss u{background:repeating-linear-gradient(90deg,rgba(255,247,230,.14) 0 2px,transparent 2px 5px)}
  .pcard .p3{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .pcard .p3 span{font-size:8.5px;color:var(--muted);letter-spacing:.03em}
  .pcard .p3 span.ttl{color:#c2a367;max-width:56%;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .pcard .p3 em{font-style:normal;font-size:8.5px;color:var(--gold-lo)}
  .act{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}

  /* ── 国力 ── */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .ncell{padding:9px 11px;border:1px solid rgba(211,171,99,.2);border-left:2px solid var(--acc);
    background-image:linear-gradient(180deg,rgba(28,20,12,.72),rgba(12,8,5,.84)),var(--p-head);
    background-size:100% 100%}
  .ncell.n1{--acc:#d0705a;--num:#e79c85}
  .ncell.n2{--acc:#e0b661;--num:#f0cd8c}
  .ncell.n3{--acc:#7fb08a;--num:#a4cdae}
  .ncell.n4{--acc:#8ba9c4;--num:#a8c4dc}
  .ncell u{display:block;text-decoration:none;font-size:9px;letter-spacing:.18em;color:var(--muted)}
  .ncell b{display:block;margin-top:4px;font-weight:400;font-size:23px;line-height:1.05;
    color:var(--num,#fbf1da);font-variant-numeric:tabular-nums;text-shadow:0 2px 8px rgba(0,0,0,.5)}
  .ncell i{display:block;margin-top:3px;font-style:normal;font-size:9px;color:var(--ash);opacity:.8}
  .dbars{margin-top:9px;display:flex;flex-direction:column;gap:6px}
  .dbar{display:flex;align-items:center;gap:8px;padding:5px 8px;
    border:1px solid rgba(211,171,99,.14);background:rgba(255,247,230,.022)}
  .dbar .nm{flex:0 0 auto;width:88px;font-size:9.5px;color:var(--ash);letter-spacing:.03em;
    display:flex;align-items:center;gap:5px}
  .dbar .nm img{width:15px;height:10px;object-fit:cover;border:1px solid rgba(0,0,0,.5);flex:0 0 auto}
  .dbar .tr{flex:1 1 auto;height:6px;background:rgba(255,247,230,.09);position:relative;
    overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
  .dbar .tr i{display:block;height:100%;background:var(--c);transition:width .5s;
    box-shadow:0 0 8px rgba(0,0,0,.4)}
  .dbar .ct{flex:0 0 auto;font-size:9px;color:var(--ash);font-variant-numeric:tabular-nums;
    min-width:44px;text-align:right}

  .hint{margin:6px 12px 9px;font-size:9.5px;line-height:1.6;color:var(--muted);
    border-left:2px solid rgba(211,171,99,.3);padding-left:9px}
  .hint[hidden]{display:none}
  .toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:9;
    font-size:10px;letter-spacing:.06em;color:#201507;padding:6px 14px;
    background:linear-gradient(180deg,#f0d69f,#c19a52);border:1px solid #f6e3b8;
    box-shadow:0 6px 18px rgba(0,0,0,.55);white-space:nowrap;
    opacity:0;pointer-events:none;transition:opacity .25s}
  .toast.on{opacity:1}

  @media (max-width:440px){
    .bar{gap:7px;padding:8px 9px}
    .moon{width:35px;height:40px}
    .moon b{font-size:17px}
    .res{gap:6px;padding-left:7px}
    .res .r{padding:2px 5px}
    .res .r b{font-size:12.5px}
    .tabs{padding:3px 4px 0}
    .tabs button{min-height:44px}
    .tabs button .ti{width:26px;height:26px}
    .tabs button span{font-size:9px;letter-spacing:.08em}
    .pane{padding:8px 8px 10px;min-height:300px}
    .pane[data-pane="who"],.pane[data-pane="gear"],.pane[data-pane="nat"]{max-height:300px;
      overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
    .plist{grid-template-columns:1fr}
    .slots{grid-template-columns:1fr}
    .stepper button{width:44px;height:44px}
    .stepper .v b{font-size:28px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="hud" id="hud" data-state="empty">
  <header class="bar">
    <div class="moon" id="moon" data-v=""><b id="moonC">—</b><i>之月</i></div>
    <div class="id">
      <div class="n"><b id="who">等待开局</b><em id="diff">—</em></div>
      <div class="t"><span id="when">火之月 · 第 1 回合</span><s id="where">位置未定</s></div>
    </div>
    <div class="res">
      <div class="r" id="rMat"><svg class="ri" id="icMat" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.3 18.4 8.4 16 20.7H8L5.6 8.4Z"/><path d="M5.6 8.4h12.8"/><path d="M9.5 8.4 12 20.7 14.5 8.4"/></svg><b>—</b></div>
      <div class="r" id="rTroop"><svg class="ri" id="icTroop" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2 19 6v5.5c0 4.2-3 7.3-7 9.3-4-2-7-5.1-7-9.3V6Z"/><path d="M12 7.4v6.8"/><path d="M9.2 10.4h5.6"/></svg><b>—</b></div>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="map" aria-selected="true"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.4"/><path d="M12 6.6 13.7 10.6 18 12 13.7 13.4 12 17.4 10.3 13.4 6 12 10.3 10.6Z"/></svg><span>地图</span></button>
    <button role="tab" data-tab="rec" aria-selected="false"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 3.2v17.6"/><path d="M6.6 4.6h11.2l-2.7 4.3 2.7 4.3H6.6"/></svg><span>征兵</span></button>
    <button role="tab" data-tab="gear" aria-selected="false"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2 13.7 12.4H10.3Z"/><path d="M7.4 12.4h9.2"/><path d="M12 12.4v5.4"/><path d="M9.8 20.6h4.4"/></svg><span>军备</span></button>
    <button role="tab" data-tab="who" aria-selected="false"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M4.8 20.4c0-3.9 3.3-6.3 7.2-6.3s7.2 2.4 7.2 6.3"/></svg><span>人物</span></button>
    <button role="tab" data-tab="nat" aria-selected="false"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.6 20.2V9.4h3v2.1h3V9.4h2.8v2.1h3V9.4h3v10.8Z"/><path d="M10.2 20.2v-4.4h3.6v4.4"/></svg><span>国力</span></button>
  </nav>

  <!-- 地图 -->
  <section class="pane" data-pane="map" data-on="1">
    <div class="mapbox" id="mapbox">
      <svg class="map" id="mapSvg" viewBox="0 0 620 360" role="img" aria-label="尤格德拉希尔五域图"></svg>
      <button class="mapback" id="mapBack" hidden>← 全图</button>
      <button class="mapdom" id="mapDom" hidden><span id="mapDomT">—</span><s>⌄</s></button>
      <div class="maptip"><span id="mapTip">点一座城，下达作战</span><span id="mapSum"></span></div>
    </div>
    <div class="maplegend">
      <span><i style="background:var(--edda)"></i>埃达</span>
      <span><i style="background:var(--thord)"></i>托尔德海姆</span>
      <span><i style="background:var(--fulk)"></i>福尔克</span>
      <span><i style="background:var(--gulanz)"></i>古兰兹</span>
      <span><i style="background:var(--valhalla)"></i>瓦尔哈拉</span>
      <span><i class="ln"></i>通路</span>
      <span><i class="sea"></i>海路</span>
      <span><i style="border:1px solid var(--gold-hi);background:none"></i>可攻</span>
    </div>
  </section>

  <!-- 征兵 -->
  <section class="pane" data-pane="rec" id="rec">
    <div class="rec">
      <div class="stepper">
        <button data-step="-10">−10</button>
        <button data-step="-1">−</button>
        <div class="v"><b id="recN">10</b><i>名兵力</i></div>
        <button data-step="1">+</button>
        <button data-step="10">+10</button>
      </div>
      <div class="calc">
        <div class="c neg"><u>消耗物资</u><b id="recCost">−20</b></div>
        <div class="c"><u>征兵后兵力</u><b id="recAfter">—</b></div>
      </div>
      <div class="hintline" id="recHint">每 1 兵力花 2 物资。征兵不推进月份，但需要当月有余粮。</div>
      <div class="fold" data-open="0">
        <button class="stog"><s>规 则</s><b>每兵 2 物资 · 维持每兵 1</b><i>▾</i></button>
        <div class="fbody">
          <div class="kline"><s>征兵价</s><b>2 物资 / 兵</b></div>
          <div class="kline"><s>维持</s><b>1 物资 / 兵 / 月</b><em>月底结算</em></div>
          <div class="kline"><s>不推进</s><b>月份不变</b><em>回合只在作战/结算后走</em></div>
          <div class="kline"><s>上限</s><b>物资 ÷ 2</b></div>
        </div>
      </div>
      <div class="big">
        <button class="btn btn--go" id="recGo">下 达 征 兵</button>
      </div>
    </div>
  </section>

  <!-- 军备 -->
  <section class="pane" data-pane="gear">
    <div class="filters" id="gearTabs">
      <button data-gt="gear" aria-pressed="true">军备</button>
      <button data-gt="bag" aria-pressed="false">行囊</button>
    </div>
    <div id="gearPane">
      <div class="sechead">库 存</div>
      <div class="inv" id="inv"><span class="none">库房是空的</span></div>
      <div class="sechead">配 装</div>
      <div class="slots" id="slots"></div>
    </div>
    <div id="bagPane" hidden>
      <div class="sechead">洛 基 的 行 囊</div>
      <div class="ilist" id="bagList"></div>
    </div>
  </section>

  <!-- 人物 -->
  <section class="pane" data-pane="who">
    <div class="hero" id="heroStrip"></div>
    <div id="whoBody"></div>
  </section>

  <!-- 国力 -->
  <section class="pane" data-pane="nat">
    <div class="grid2">
      <div class="ncell n1" data-cell="troop"><u>兵 力</u><b id="nTroop">—</b><i id="nTroopD">维持 −0 / 月</i></div>
      <div class="ncell n2" data-cell="mat"><u>物 资</u><b id="nMat">—</b><i id="nMatD">净收支 +0 / 月</i></div>
      <div class="ncell n3" data-cell="land"><u>领 地</u><b id="nLand">—</b><i>已占小分区</i></div>
      <div class="ncell n4" data-cell="prod"><u>月 产</u><b id="nProd">—</b><i id="nProdD">含基础生产</i></div>
    </div>
    <div class="dbars" id="dbars"></div>
    <div class="hintline" style="margin-top:10px" id="natFoot">—</div>
  </section>

  <div class="hint" id="hint" hidden></div>
  <div class="toast" id="toast"></div>
</div>

<script>

  /* ── 地图 ── */
  var S = 0.32, OX = 68.5, OY = 21;
  function px(x){ return OX + (x - 79) * S; }
  function py(y){ return OY + (y - 90) * S; }

  function hull(points){
    var pts = points.slice().sort(function(a,b){ return a[0]-b[0] || a[1]-b[1]; });
    if(pts.length < 3) return pts;
    function cross(o,a,b){ return (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]); }
    var lo=[], up=[], i;
    for(i=0;i<pts.length;i++){ while(lo.length>=2 && cross(lo[lo.length-2],lo[lo.length-1],pts[i])<=0) lo.pop(); lo.push(pts[i]); }
    for(i=pts.length-1;i>=0;i--){ while(up.length>=2 && cross(up[up.length-2],up[up.length-1],pts[i])<=0) up.pop(); up.push(pts[i]); }
    lo.pop(); up.pop();
    return lo.concat(up);
  }
  function inflate(poly, pad){
    if(!poly.length) return poly;
    var cx=0, cy=0;
    poly.forEach(function(p){ cx+=p[0]; cy+=p[1]; });
    cx/=poly.length; cy/=poly.length;
    return poly.map(function(p){
      var dx=p[0]-cx, dy=p[1]-cy, L=Math.hypot(dx,dy)||1;
      return [p[0]+dx/L*pad, p[1]+dy/L*pad];
    });
  }
  function shrink(poly, k){
    var cx=0, cy=0;
    poly.forEach(function(p){ cx+=p[0]; cy+=p[1]; });
    cx/=poly.length; cy/=poly.length;
    return poly.map(function(p){ return [cx+(p[0]-cx)*k, cy+(p[1]-cy)*k]; });
  }
  function polyStr(poly){
    return poly.map(function(p){ return p[0].toFixed(1)+","+p[1].toFixed(1); }).join(" ");
  }
  function isCapital(n){ return /^首都/.test(n) || n === "瓦尔哈拉宫殿" || n === "世界树"; }

  var NS = "http://www.w3.org/2000/svg";
  function svgEl(n, a, t){
    var e = document.createElementNS(NS, n);
    if(a) for(var k in a) e.setAttribute(k, a[k]);
    if(t !== undefined) e.textContent = t;
    return e;
  }

  function placeLabels(list){
    if(!list.length) return;
    function collides(box){
      for(var i=0;i<placedAll.length;i++){
        var r = placedAll[i];
        if(box.x < r.x + r.w + .6 && box.x + box.w + .6 > r.x &&
           box.y < r.y + r.h + .6 && box.y + box.h + .6 > r.y) return true;
      }
      return false;
    }
    var placedAll = [];
    var cands = [
      [4.4, -7.2, "start"], [-4.4, -7.2, "end"],
      [4.4, 8.4, "start"], [-4.4, 8.4, "end"],
      [0, -9.2, "middle"], [0, 11.2, "middle"],
      [7.5, .8, "start"], [-7.5, .8, "end"]
    ];
    function tryPlace(it, fs, withG, soft){
      var name = it.c.n;
      var w = name.length * fs * 1.0 + 2.5;
      var h = withG ? fs + 7.2 : fs + 2.2;
      for(var i=0;i<cands.length;i++){
        var o = cands[i];
        var bx = o[2] === "middle" ? it.cx + o[0] - w/2 : (o[2] === "end" ? it.cx + o[0] - w : it.cx + o[0]);
        var by = it.cy + o[1] - fs + 1.4;
        var box = { x:bx, y:by, w:w, h:h };
        if(box.x < 2 || box.x + w > 618 || box.y < 1 || box.y + h > 359) continue;
        if(!soft && collides(box)) continue;
        placedAll.push(box);
        var cls = fs < 8 ? "tl n sm" : "tl n";
        it.g.appendChild(svgEl("text", { x:(it.cx+o[0]).toFixed(1), y:(it.cy+o[1]).toFixed(1),
          "text-anchor": o[2], "class":cls }, name));
        if(it.on && withG){
          it.g.appendChild(svgEl("text", { x:(it.cx+o[0]).toFixed(1), y:(it.cy+o[1]+6.6).toFixed(1),
            "text-anchor": o[2], "class":"tl g" }, "产 " + it.c.p));
        }
        return true;
      }
      return false;
    }
    var rest = [];
    list.forEach(function(it){ if(!tryPlace(it, 8.2, true, false)) rest.push(it); });
    var rest2 = [];
    rest.forEach(function(it){ if(!tryPlace(it, 7, true, false)) rest2.push(it); });
    rest2.forEach(function(it){ if(!tryPlace(it, 6.8, false, false)) tryPlace(it, 6.8, false, true); });
  }

      var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
      pts.forEach(function(p){ x0=Math.min(x0,p[0]); y0=Math.min(y0,p[1]); x1=Math.max(x1,p[0]); y1=Math.max(y1,p[1]); });

  /* 触摸命中：按屏幕距离找最近的城，比小圆点本身大一圈也不会互相抢 */
  function mapPoint(ev){

    var w = vb.width || 620, h = vb.height || 360;
    return { x: vb.x + (ev.clientX - r.left) / r.width * w,
             y: vb.y + (ev.clientY - r.top) / r.height * h,
             px: r.width / w };
  }
  function cityAt(ev){

      var d = Math.sqrt((p.x - px(c.x)) * (p.x - px(c.x)) + (p.y - py(c.y)) * (p.y - py(c.y)));
      if(d < bd){ bd = d; best = c; }
    });
    return (best && bd <= 12 / p.px) ? best : null;
  }

  function econ(){

    ownList.forEach(function(n){ calc += prodOf(n); });
    var land = obj(stat().领地) || {};
    var stored = num(land.已占生产);
    var prod = (stored === null || (stored === 0 && ownList.length)) ? calc : stored;
    var base = BASE_PROD[str((obj(stat().玩家) || {}).难度)] || 0;

    if(ch.god){
      if(corrupt) pb.appendChild(meter("狂堕", num(d.狂堕), "cor"));
      else pb.appendChild(meter("淫乱", num(d.淫乱), "hot"));
    }

    var p3 = document.createElement("div");
    p3.className = "p3";
    var tt = document.createElement("span"); tt.className = "ttl";
    tt.textContent = ch.t || "";
    var st2 = document.createElement("span");
    st2.textContent = (str(d.阶段) && str(d.阶段) !== "未遇") ? " · " + str(d.阶段) : "";
    var pw = document.createElement("span"); pw.textContent = "战力 " + powerOf(ch);
    if(ch.t) { p3.appendChild(tt); p3.appendChild(st2); p3.appendChild(pw); }
    else p3.appendChild(pw);
    var eq = arr(d.装备);
    if(eq.length){
      var em = document.createElement("em"); em.textContent = eq.join(" / ");
      p3.appendChild(em);
    }
    if(inField(ch.k)){
      var act = document.createElement("div");
      act.className = "act";
      var pickSel = null;
      var a = document.createElement("button");
      a.className = "btn btn--sm"; a.textContent = "亲近";
      a.setAttribute("aria-pressed", "false");
      var b2 = null;
      if(ch.god){
        b2 = document.createElement("button");
        b2.className = "btn btn--sm btn--violet"; b2.textContent = "调教";
        b2.setAttribute("aria-pressed", "false");
      }
      function pickAct(v){
        var same = pickSel === v;
        pickSel = same ? null : v;
        a.setAttribute("aria-pressed", pickSel === "亲" ? "true" : "false");
        if(b2) b2.setAttribute("aria-pressed", pickSel === "调" ? "true" : "false");
        if(!same) command("【" + (v === "亲" ? "亲近" : "调教") + "】" + ch.k);
      }
      a.addEventListener("click", function(ev){ ev.stopPropagation(); pickAct("亲"); });
      if(b2) b2.addEventListener("click", function(ev){ ev.stopPropagation(); pickAct("调"); });
      act.appendChild(a);
      if(b2) act.appendChild(b2);
      p3.appendChild(act);
    }
    pb.appendChild(p3);

    el.style.cursor = "pointer";
    el.addEventListener("click", function(ev){
      if(ev.target.closest && ev.target.closest(".act")) return;
      openChar(ch);
    });
    el.appendChild(pt); el.appendChild(pb);
    return el;
  }
  function renderHero(){
    var box = $("heroStrip");
    if(!box) return;
    box.innerHTML = "";
    var hero = obj(stat().主角) || {}, g = obj(stat().玩家) || {};
    var nm = document.createElement("b"); nm.textContent = str(g.名字) || "洛基";
    var st = document.createElement("s");
    st.textContent = (str(hero.状态) || "如常") + " · " + (str(hero.位置) || "位置未定");
    var bag = document.createElement("i");
    bag.textContent = "行囊 " + arr(stat().物品).length;
    box.appendChild(nm); box.appendChild(st); box.appendChild(bag);
  }

  function renderWho(){
    renderHero();
    var box = $("whoBody");
    box.innerHTML = "";
    var here = [], away = [];
    CHARS.forEach(function(ch){ if(!known(ch.k)) return; (inField(ch.k) ? here : away).push(ch); });

    if(!here.length && !away.length){
      var n = document.createElement("div");
      n.className = "hintline";
      n.textContent = "还没有认识的人。登陆之后，遇到的人才进这张表。";
      box.appendChild(n);
      return;
    }
    [["在 场", here], ["不 在 场", away]].forEach(function(pair){
      if(!pair[1].length) return;
      var h = document.createElement("div");
      h.className = "sechead"; h.textContent = pair[0];
      box.appendChild(h);
      var list = document.createElement("div");
      list.className = "plist";
      pair[1].forEach(function(ch){ list.appendChild(pcard(ch)); });
      box.appendChild(list);
    });
  }

  function openChar(ch){
    closeSheet();
    var d = obj(people()[ch.k]) || {};
    var corrupt = str(d.神格) === "恶";
    var here = inField(ch.k);
    var s = document.createElement("div");
    s.className = "sheet sheet--char";

    var h = document.createElement("div");
    h.className = "sh";
    var b = document.createElement("b"); b.textContent = ch.k;
    var i2 = document.createElement("i");
    i2.textContent = ch.god ? ("神 · " + (corrupt ? "已堕" : "善")) : (ch.t || "眷属");
    var x = document.createElement("button"); x.className = "btn btn--quiet btn--sm";
    x.textContent = "收起";
    x.addEventListener("click", closeSheet);
    h.appendChild(b); h.appendChild(i2); h.appendChild(x);
    s.appendChild(h);

    var body = document.createElement("div"); body.className = "cbody";
    var fr = document.createElement("div"); fr.className = "cframe" + (corrupt ? " cor" : "");
    var artKey = (corrupt && ART[ch.a + "_dark"]) ? ch.a + "_dark" : ch.a;
    if(ART[artKey]){ var im = document.createElement("img"); im.src = ART[artKey]; im.alt = ""; fr.appendChild(im); }
    var stq0 = str(d.状态);
    if(stq0 && stq0 !== "如常"){
      var badge = document.createElement("div"); badge.className = "cfbadge"; badge.textContent = stq0;
      fr.appendChild(badge);
    }
    body.appendChild(fr);

    var info = document.createElement("div"); info.className = "cinfo";
    function row2(list){
      var r = document.createElement("div"); r.className = "crow";
      list.forEach(function(p){
        var sp = document.createElement("span");
        var ss = document.createElement("s"); ss.textContent = p[0];
        var bb = document.createElement("b"); bb.textContent = String(p[1]);
        if(p[2]) bb.className = p[2];
        sp.appendChild(ss); sp.appendChild(bb); r.appendChild(sp);
      });
      return r;
    }
    var sen = ch.god ? num(corrupt ? d.狂堕 : d.淫乱) : null;
    info.appendChild(row2([
      ["战力", powerOf(ch)],
      ["好感", num(d.好感) === null ? "—" : num(d.好感)],
      ch.god ? [corrupt ? "狂堕" : "淫乱", sen === null ? "—" : sen, "hot"]
             : ["阶段", str(d.阶段) || "—"]
    ]));
    info.appendChild(row2([["所在", str(d.所在) || "—"]]));
    if(ch.god) info.appendChild(row2([["阶段", str(d.阶段) || "—"]]));
    info.appendChild(row2([["装备", arr(d.装备).join(" · ") || "空"]]));
    body.appendChild(info);
    s.appendChild(body);

    if(ch.bg){
      var bg = document.createElement("div"); bg.className = "cbg";
      bg.textContent = ch.bg;
      s.appendChild(bg);
    }
    var thq = str(d.想法);
    if(thq){
      var th = document.createElement("div"); th.className = "cth";
      th.textContent = "「" + thq + "」";
      s.appendChild(th);
    }

    var big = document.createElement("div"); big.className = "big";
    if(here){
      var sel = null;
      var a = document.createElement("button");
      a.className = "btn"; a.textContent = "亲 近";
      a.setAttribute("aria-pressed", "false");
      var b2 = null;
      if(ch.god){
        b2 = document.createElement("button");
        b2.className = "btn btn--violet"; b2.textContent = "调 教";
        b2.setAttribute("aria-pressed", "false");
      }
      function pickChar(v){
        var same = sel === v;
        sel = same ? null : v;
        a.setAttribute("aria-pressed", sel === "亲" ? "true" : "false");
        if(b2) b2.setAttribute("aria-pressed", sel === "调" ? "true" : "false");
        if(!same) command("【" + (v === "亲" ? "亲近" : "调教") + "】" + ch.k);
      }
      a.addEventListener("click", function(){ pickChar("亲"); });
      if(b2) b2.addEventListener("click", function(){ pickChar("调"); });
      big.appendChild(a);
      if(b2) big.appendChild(b2);
    }
    var shut = document.createElement("button");
    shut.className = "btn btn--quiet"; shut.textContent = "关 闭";
    shut.addEventListener("click", closeSheet);
    big.appendChild(shut);
    s.appendChild(big);

    var hint = document.createElement("div");
    hint.className = "hintline"; hint.style.marginTop = "7px";
    hint.textContent = here
      ? "点亲近或调教就直接下达；两个都不点，就只是看看。"
      : "她不在场，这次只能看资料。";
    s.appendChild(hint);

    $("hud").appendChild(s);
    s.style.position = "absolute";
    sheet = s;
  }
  /* ── 国力 ── */
  function renderNat(){
    var mat = num(stat().物资), troop = num(stat().兵力);
    var ownList = owned();
    var calc = 0;
    ownList.forEach(function(n){ calc += prodOf(n); });
    var stored = num((obj(stat().领地) || {}).已占生产);
    // 变量是准的；模型忘了加减时，用城市表推算兜底
    var prod = (stored === null || (stored === 0 && ownList.length)) ? calc : stored;
    var base = BASE_PROD[str(obj(stat().玩家) && obj(stat().玩家).难度)] || 0;
    var totalProd = prod + base;
    var upkeep = troop === null ? 0 : troop;
    var net = totalProd - upkeep;

    $("nTroop").textContent = troop === null ? "—" : String(troop);
    $("nTroopD").textContent = "维持 −" + upkeep + " / 月";
    $("nMat").textContent = mat === null ? "—" : String(mat);
    $("nMatD").textContent = "净收支 " + (net >= 0 ? "+" : "") + net + " / 月";
    $("nLand").textContent = ownList.length + " / " + TOTAL_CITY;
    $("nProd").textContent = String(totalProd);
    $("nProdD").textContent = "基础 " + base + " ＋ 领地 " + prod +
      (stored !== null && stored !== prod ? "（记 " + stored + "）" : "");

    var bars = $("dbars");
    bars.innerHTML = "";
    DOMAINS.forEach(function(d){
      var cnt = 0;
      ownList.forEach(function(n){
        for(var i=0;i<CITIES.length;i++) if(CITIES[i].n === n && CITIES[i].r === d.k) cnt++;
      });
      var row = document.createElement("div");
      row.className = "dbar";
      row.style.setProperty("--c", "var(" + d.c + ")");
      var nm = document.createElement("div"); nm.className = "nm";
      var fl = ART["flag"+d.k];
      if(fl){
        var fi = document.createElement("img");
        fi.src = fl; fi.alt = "";
        nm.appendChild(fi);
      }
      nm.appendChild(document.createTextNode(d.n));
      var tr = document.createElement("div"); tr.className = "tr";
      var fill = document.createElement("i");
      fill.style.width = (cnt / d.max * 100).toFixed(1) + "%";
      tr.appendChild(fill);
      var ct = document.createElement("div"); ct.className = "ct";
      ct.textContent = cnt + " / " + d.max;
      row.appendChild(nm); row.appendChild(tr); row.appendChild(ct);
      row.style.cursor = "pointer";
      row.addEventListener("click", function(){
        showTab("map"); zoom = d.k; selCity = null; closeSheet(); renderMap(); syncHeight();
      });
      bars.appendChild(row);
    });

    var key = str((obj(stat().进展) || {}).命运之钥) || "沉睡";
    var goal = str((obj(stat().进展) || {}).当前目标) || "—";
    $("natFoot").textContent = "命运之钥 " + key + " · 当前目标：" + goal;
  }

  /* ── 头部 ── */
  function renderHead(){
    var g = obj(stat().玩家) || {};
    var hero = obj(stat().主角) || {};
    var mon = num(stat().月份);
    if(mon === null){
      $("moon").dataset.v = ""; $("moonC").textContent = "—"; $("when").textContent = "—";
      document.documentElement.style.setProperty("--moon", "var(--gold)");
    }else{
      var mi = Math.floor((mon - 1) % 8), yr = Math.floor((mon - 1) / 8) + 1;
      $("moon").dataset.v = MOON[mi];
      $("moonC").textContent = MOON[mi];
      $("when").textContent = "第 " + yr + " 年 · " + MOON[mi] + "之月 · 第 " + mon + " 回合";
      document.documentElement.style.setProperty("--moon", MOONC[mi] || "var(--gold)");
    }
    $("who").textContent = str(g.名字) || "洛基";
    $("diff").textContent = str(g.难度) || "—";
    $("where").textContent = str(hero.位置) || "位置未定";
    var mat = num(stat().物资), troop = num(stat().兵力);
    $("rMat").querySelector("b").textContent = mat === null ? "—" : String(mat);
    $("rTroop").querySelector("b").textContent = troop === null ? "—" : String(troop);
  }

  function renderEmpty(text){
    hud.dataset.state = "empty";
    stat_empty();
    $("hint").hidden = !text;
    if(text) $("hint").textContent = text;
    syncHeight();
  }
  function stat_empty(){
    sd = {};
    $("moon").dataset.v = ""; $("moonC").textContent = "—";
    $("when").textContent = "火之月 · 第 1 回合";
    $("who").textContent = "等待开局";
    $("diff").textContent = "—";
    $("where").textContent = "位置未定";
    $("rMat").querySelector("b").textContent = "—";
    $("rTroop").querySelector("b").textContent = "—";
    renderMap(); renderRec(); renderGear(); renderWho(); renderNat();
  }

  function render(data){
    sd = data;
    hud.dataset.state = "ok";
    $("hint").hidden = true;
    renderHead();
    renderMap();
    renderRec();
    renderGear();
    renderWho();
    renderNat();
    syncHeight();
  }

  /* ── 高度 / 挂载 ── */
  function measureHeight(){
    return Math.max(document.documentElement.scrollHeight || 0,
      document.body ? document.body.scrollHeight : 0, 220) + 2;
  }
  function syncHeight(){
    var h = measureHeight();
    try{ if(window.frameElement) window.frameElement.style.height = h + "px"; }catch(e){}
    if(window.parent !== window){
      post({ type:"vbf-status-height", protocol:"vbf-status/1", height:h });
    }
  }
  function isStale(){
    try{
      var fe = window.frameElement;
      if(!fe || !fe.closest) return false;
      var mes = fe.closest(".mes");
      if(!mes) return false;
      var all = window.parent.document.querySelectorAll("#chat .mes");
      var last = all[all.length - 1];
      if(last === mes) return false;
      if(last && last.classList.contains("is_user") && all[all.length - 2] === mes) return false;
      return true;
    }catch(e){ return false; }
  }

  /* ── 主循环 ── */
  function apply(data, chat){
    if(chat !== null && chat !== undefined && chat !== ""){
      var id = String(chat);
      if(chatId !== null && chatId !== id){ shown = ""; }
      chatId = id;
    }
    var sig = data ? JSON.stringify(data) : "null";
    if(sig === shown) return;
    shown = sig;
    if(data) render(data);
    else renderEmpty(hasBridge ? "已连上酒馆，但还没读到开局数据。" : "");
  }
  function directStat(){
    try{
      var W = window.parent;
      var H = W.TavernHelper;
      if(!H || typeof H.getVariables !== "function") return null;
      var v = H.getVariables({ type:"chat" });
      if(v && typeof v === "object" && v.stat_data) return v.stat_data;
      if(v && typeof v === "object" && Object.keys(v).length) return v;
    }catch(e){}
    return null;
  }
  function directChat(){
    try{
      var c = window.parent.SillyTavern.getContext();
      return c && c.chatId ? c.chatId : null;
    }catch(e){ return null; }
  }
  function tick(){
    try{ if(window.frameElement) window.frameElement.style.display = isStale() ? "none" : ""; }catch(e){}
    var data = directStat(), chat = directChat();
    if(data === null && hasBridge) data = bridged;
    if(data === null && !hasBridge){
      if(Date.now() - bootAt < 4000) renderEmpty("正在读取酒馆状态…");
      else renderEmpty("没收到酒馆数据。确认卡里的「VBF 前端」脚本已启用。");
      return;
    }
    apply(data, chat);
  }

  window.addEventListener("load", function(){ setTimeout(syncHeight, 250); });
  window.addEventListener("message", function(event){
    if(event.source !== window.parent) return;
    var d = event.data || {};
    if(d.protocol && d.protocol !== "vbf-status/1") return;
    if(d.type === "vbf-state"){
      hasBridge = true;
      bridged = (d.stat_data && typeof d.stat_data === "object") ? d.stat_data : null;
      apply(bridged, d.chat);
    }
    if(d.type === "vbf-ack") toast(d.text || "已收到");
  });
  if(window.ResizeObserver) new ResizeObserver(function(){ syncHeight(); }).observe(document.body);

  (function(){
    var bar = document.querySelector(".bar");
    if(bar && ART.topbar){
      bar.style.backgroundImage = "linear-gradient(180deg,rgba(10,9,7,.80),rgba(10,9,7,.92)), url(" + ART.topbar + ")";
    }
  })();

  // 原游戏底板 / 页签图标
  (function(){
    var rs = document.documentElement.style;
    if(ART.pInfo) rs.setProperty("--p-info", "url(" + ART.pInfo + ")");
    if(ART.pHead) rs.setProperty("--p-head", "url(" + ART.pHead + ")");
    if(ART.pRow)  rs.setProperty("--p-row",  "url(" + ART.pRow + ")");
  })();

  renderEmpty("");
  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", function(){ setTimeout(tick, 60); });
  }else setTimeout(tick, 60);
  setInterval(tick, 1500);

  // 本地双击时给一份样例

    setTimeout(function(){
      hasBridge = true;
      bridged = null;
      var DEMO = ({
        月份:[15,""], 物资:[486,""], 兵力:[96,""],
        玩家:{ 名字:["洛基",""], 难度:["困难",""] },
        主角:{ 位置:["福尔克 · 首都莱康厄尔",""], 状态:["左肩带伤，魔力尚足",""] },
        领地:{ 已占:["首都图尔库","克里卡森林","哈米纳湖畔","首都莱康厄尔","大都市孔斯贝格","奥勒松平原","瓦尔考斯"],
               已占生产:44 },
        进展:{ 当前目标:["向古兰兹推进，先取艾鲁谢鲁",""], 命运之钥:["觉醒",""] },
        物品:[["命运之钥","辛莫拉的信","伤药","古树之枝","褪色的军旗"],""],
        军备:[["长剑","圣盾","炎之剑","军粮","铁盾"],""],
        人物:{
          狄璐卡:{ 状态:["轻伤未愈",""], 想法:["这个人，明明可以不管我的。",""], 好感:[82,""], 淫乱:[46,""], 狂堕:[0,""], 神格:["善",""], 所在:["阵中",""], 阶段:["动摇",""], 装备:[["长剑","圣盾"],""] },
          托尔:{ 状态:["亢奋",""], 想法:["再打一场，就一场。",""], 好感:[61,""], 淫乱:[0,""], 狂堕:[34,""], 神格:["恶",""], 所在:["阵中",""], 阶段:["堕落",""], 装备:[["炎之剑","" ],""] },
          芙蕾雅:{ 状态:["被俘 · 沉默",""], 想法:["我竟然在等他开口。",""], 好感:[38,""], 淫乱:[12,""], 狂堕:[0,""], 神格:["善",""], 所在:["被俘",""], 阶段:["对峙",""], 装备:[["",""],""] },
          莉格蕾特:{ 状态:["警惕",""], 想法:["他到底想从我这里拿走什么？",""], 好感:[15,""], 淫乱:[0,""], 狂堕:[0,""], 神格:["善",""], 所在:["敌方",""], 阶段:["初遇",""], 装备:[["",""],""] },
          奥丁:{ 状态:["静观",""], 想法:["这个孩子，还差得远。",""], 好感:[22,""], 淫乱:[0,""], 狂堕:[0,""], 神格:["善",""], 所在:["敌方",""], 阶段:["初遇",""], 装备:[["",""],""] },
          海拉:{ 状态:["列阵",""], 想法:["别以为你配站在我面前。",""], 好感:[-35,""], 所在:["敌方",""], 阶段:["对峙",""], 装备:[["",""],""] },
          芬尼尔:{ 状态:["懒散",""], 想法:["陪我玩一会儿嘛。",""], 好感:[18,""], 所在:["敌方",""], 阶段:["初遇",""], 装备:[["",""],""] },
          耶梦加得:{ 状态:["暴怒",""], 想法:["我要让他也尝尝那种痛。",""], 好感:[-62,""], 所在:["敌方",""], 阶段:["对峙",""], 装备:[["",""],""] },
          西米尔:{ 状态:["按兵",""], 想法:["先看看他能走多远。",""], 好感:[44,""], 所在:["阵中",""], 阶段:["动摇",""], 装备:[["圣盾",""],""] },
          菲娜:{ 状态:["操劳",""], 想法:["再这样乱来，我可不背你回来。",""], 好感:[86,""], 所在:["阵中",""], 阶段:["初遇",""], 装备:[["铁盾",""],""] },
          加尔姆:{ 状态:["受伤",""], 想法:["这活儿真不划算。",""], 好感:[71,""], 所在:["受伤",""], 阶段:["初遇",""], 装备:[["",""],""] }
        }
      });
      bridged = DEMO;
      apply(DEMO, "demo-chat");
    }, 120);
  }
})();
